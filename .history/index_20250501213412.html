<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@100;200;300&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'SF Pro Display', sans-serif;
            background-color: #f4f4f4;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .calculator {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            width: 320px;
        }
        .display {
            font-size: 2rem;
            background: #222;
            color: white;
            padding: 10px;
            border-radius: 10px;
            text-align: right;
            margin-bottom: 10px;
        }
        .button-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .button {
            background: #f1f1f1;
            border: none;
            padding: 20px;
            font-size: 1.5rem;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .button:hover {
            background: #ccc;
        }
        .button:active {
            background: #bbb;
        }
        .button-clear {
            background-color: #ff3b30;
            color: white;
        }
        .button-equal {
            background-color: #007aff;
            color: white;
        }
        .button-function {
            background-color: #ddd;
        }
    </style>
</head>
<body>
    <div class="calculator">
        <div class="display" id="display">0</div>
        <div class="button-row">
            <button class="button button-clear" onclick="clearDisplay()">C</button>
            <button class="button button-function" onclick="backspace()">⌫</button>
            <button class="button button-function" onclick="appendCharacter('%')">%</button>
            <button class="button button-function" onclick="appendCharacter('/')">/</button>
            <button class="button button-function" onclick="appendCharacter('(')">(</button>
            <button class="button button-function" onclick="appendCharacter(')')">)</button>
            <button class="button button-function" onclick="appendCharacter('*')">*</button>
            <button class="button" onclick="appendCharacter('7')">7</button>
            <button class="button" onclick="appendCharacter('8')">8</button>
            <button class="button" onclick="appendCharacter('9')">9</button>
            <button class="button button-function" onclick="appendCharacter('-')">-</button>
            <button class="button" onclick="appendCharacter('4')">4</button>
            <button class="button" onclick="appendCharacter('5')">5</button>
            <button class="button" onclick="appendCharacter('6')">6</button>
            <button class="button button-function" onclick="appendCharacter('+')">+</button>
            <button class="button" onclick="appendCharacter('1')">1</button>
            <button class="button" onclick="appendCharacter('2')">2</button>
            <button class="button" onclick="appendCharacter('3')">3</button>
            <button class="button button-equal" onclick="calculateResult()">=</button>
            <button class="button" onclick="appendCharacter('0')">0</button>
        </div>
    </div>

    <script>
        function clearDisplay() {
            document.getElementById("display").innerText = "0";
        }

        function backspace() {
            let currentDisplay = document.getElementById("display").innerText;
            if (currentDisplay.length === 1) {
                document.getElementById("display").innerText = "0";
            } else {
                document.getElementById("display").innerText = currentDisplay.slice(0, -1);
            }
        }

        function appendCharacter(character) {
            let currentDisplay = document.getElementById("display").innerText;
            if (currentDisplay === "0" && character !== "0") {
                document.getElementById("display").innerText = character;
            } else {
                document.getElementById("display").innerText = currentDisplay + character;
            }
        }

        function calculateResult() {
            let currentDisplay = document.getElementById("display").innerText;
            try {
                // Using the `eval` function to evaluate the expression. It's safe here because we're sanitizing inputs.
                let result = eval(currentDisplay);
                document.getElementById("display").innerText = result;
            } catch (e) {
                document.getElementById("display").innerText = "Error";
            }
        }
    </script>
</body>
</html>
